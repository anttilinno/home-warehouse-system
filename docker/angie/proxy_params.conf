proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# NOT $proxy_add_x_forwarded_for. That APPENDS to whatever the client sent, and
# chi's middleware.RealIP (backend) takes the LEFTMOST value — so a client
# sending its own X-Forwarded-For controls what the backend records as
# RemoteAddr, which is what the auth rate limiter keys on. Overwriting with the
# real peer makes the leftmost value the only value.
#
# This deployment has exactly ONE proxy hop (Angie is the ingress), so nothing
# downstream needs the forwarded chain. Restore the appending form only together
# with a trusted-proxy allowlist in the backend.
proxy_set_header X-Forwarded-For   $remote_addr;

# Cleared, never forwarded: chi's RealIP checks True-Client-IP BEFORE X-Real-IP
# and X-Forwarded-For. Nothing in this stack sets it, so any value present came
# from the client and would win outright.
proxy_set_header True-Client-IP    "";

proxy_set_header X-Forwarded-Proto $scheme;
