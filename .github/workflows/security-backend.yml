name: security-backend

# Backend security gate. Mirrors the local audit (docs/audit/) so dependency
# CVEs, SAST regressions, and leaked secrets are caught in CI rather than by
# hand. Runs only when backend code or this workflow changes.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/security-backend.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/security-backend.yml"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # govulncheck compiles the packages it analyses, so it needs the same cgo
      # headers the build does — without libwebp-dev it aborts on
      # `fatal error: webp/encode.h: No such file or directory` before scanning.
      - name: Install libwebp headers (cgo dep for go-webp)
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev
      - name: govulncheck (reachable CVEs)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lockfile scanning only. osv-scanner runs govulncheck call analysis for
      # Go by default, and it cannot: the action ships Go 1.25.3 with
      # GOTOOLCHAIN=local, so it refuses to build a module whose directive is
      # pinned to go1.25.12 — and that pin is a deliberate stdlib security
      # floor (see backend/go.mod), so it is not moving. The job died on
      # "Failed to run code analysis (govulncheck)" before reporting anything.
      # Nothing is lost: the govulncheck job above does reachability properly,
      # with the right toolchain and the cgo headers it needs.
      - name: osv-scanner (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --no-call-analysis=go
            --config=backend/osv-scanner.toml
            --lockfile=backend/go.mod

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install libwebp headers (cgo dep for go-webp)
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev
      # This job had never actually run (it died on the missing libwebp headers),
      # so its 158 findings had never been triaged. They were, on 2026-07-29, and
      # the exclusions below are the result — each is a rule gosec cannot prove
      # safe because the guard lives somewhere it does not follow. What was
      # genuinely wrong got FIXED instead (directory/file permissions, two
      # unchecked Atoi→int32 conversions on uploaded workbook cells).
      #
      #   G115 (88) integer conversion — int32(pagination.Limit()/Offset()) and
      #        friends; bounded by request validation before they get here.
      #   G124 (9)  cookie attributes — every auth cookie is built by
      #        createAuthCookie/its inline twins with HttpOnly: true, SameSite:
      #        Lax and Secure from config.SecureCookies(). gosec wants a literal
      #        `true` and cannot see a runtime value.
      #   G120 (7)  unbounded form parsing — every site passes an explicit
      #        ParseMultipartForm(MaxFileSize/MaxAvatarSize) AND sits behind the
      #        MaxBodySize middleware (http.MaxBytesReader).
      #   G304/G703 (34) path traversal — either resolved through
      #        LocalStorage.resolveWithinBase (validate + Abs + Rel + reject
      #        "..") or paths from os.CreateTemp/os.Create that no request
      #        controls. Some sites already carried //nolint:gosec notes, which
      #        gosec does not honour (that is golangci syntax).
      #   G710 (5)  open redirect — targets are server-built: "/claim/"+code and
      #        "/items/"+uuid can never become protocol-relative, and the
      #        authelia/oauth redirects use the configured appURL.
      #
      # G404 is deliberately NOT excluded: its single site (cmd/seed) carries an
      # inline #nosec, so real misuse in production code still fails here.
      - name: gosec (SAST)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd backend && gosec -quiet -severity medium -confidence medium \
            -exclude=G115,G120,G124,G304,G703,G710 ./...

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy filesystem scan
        # Tags carry a `v` prefix — `@0.28.0` resolves to nothing and the job
        # died on "Unable to resolve action" before scanning anything.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
