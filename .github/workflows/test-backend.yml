name: test-backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # go.sum is under backend/, not the repo root — without this the
          # module cache never restores and every run re-downloads.
          cache-dependency-path: backend/go.sum
      # kolesa-team/go-webp is a cgo binding to libwebp. Without the dev headers
      # EVERY package fails to build (`fatal error: webp/encode.h: No such file
      # or directory`), so `go test ./...` reports build failures instead of
      # running a single test — which is what this job did on every run.
      - name: Install libwebp headers (cgo dep for go-webp)
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev
      - name: go test
        run: cd backend && go test ./...

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wh
          POSTGRES_PASSWORD: wh
          POSTGRES_DB: warehouse_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U wh -d warehouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # sslmode=disable is required: the postgres service container has no TLS,
      # and dbmate's driver defaults to requiring it — without this, migrations
      # die on `pq: SSL is not enabled on the server`. e2e-frontend.yml already
      # carried the parameter; this workflow never did, which stayed invisible
      # while the job failed earlier at the build step.
      DBMATE_DATABASE_URL: postgresql://wh:wh@localhost:5432/warehouse_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://wh:wh@localhost:5432/warehouse_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install libwebp headers (cgo dep for go-webp)
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev

      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate
      - name: Apply migrations
        run: DATABASE_URL="$DBMATE_DATABASE_URL" dbmate -d backend/db/migrations up

      # -p 1 is mandatory: integration tests share the warehouse_test DB across
      # packages (truncate/seed each other's rows), so parallel package runs
      # corrupt each other's fixtures. Serial execution is the correctness
      # requirement, not a perf knob.
      - name: go test (integration)
        run: cd backend && go test -tags=integration -count=1 -p 1 ./...
